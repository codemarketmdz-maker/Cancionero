name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Buscar la carpeta del proyecto
        id: proj
        run: |
          F=$(find . -name settings.gradle | head -n 1)
          if [ -z "$F" ] && [ -f cancionero-misa.zip ]; then
            echo "Descomprimiendo cancionero-misa.zip..."
            mkdir -p proyecto
            unzip -q cancionero-misa.zip -d proyecto
            F=$(find proyecto -name settings.gradle | head -n 1)
          fi
          if [ -z "$F" ]; then
            echo "No se encontró settings.gradle en el repositorio. Archivos que hay:"
            find . -path ./.git -prune -o -type f -print | head -50
            exit 1
          fi
          D=$(dirname "$F")
          echo "Proyecto encontrado en: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - name: Descargar el lector de PDF (pdf.js)
        run: |
          A="$GITHUB_WORKSPACE/${{ steps.proj.outputs.dir }}/app/src/main/assets"
          mkdir -p "$A" /tmp/pdfjs
          (cd /tmp/pdfjs && npm pack pdfjs-dist@3.11.174 --silent && tar xzf pdfjs-dist-3.11.174.tgz)
          cp /tmp/pdfjs/package/build/pdf.min.js "$A/pdf.min.js"
          cp /tmp/pdfjs/package/build/pdf.worker.min.js "$A/pdf.worker.min.js"
          ls -la "$A"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: cancionero-misa-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en Releases (para bajarlo directo desde el celular)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" cancionero-misa.apk
          gh release delete apk-actual --yes --cleanup-tag || true
          gh release create apk-actual cancionero-misa.apk \
            --title "APK actual" \
            --notes "Última versión compilada automáticamente. Descargá cancionero-misa.apk e instalalo."
