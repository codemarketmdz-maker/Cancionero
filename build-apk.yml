name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: cancionero-misa-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en Releases (para bajarlo directo desde el celular)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk cancionero-misa.apk
          gh release delete apk-actual --yes --cleanup-tag || true
          gh release create apk-actual cancionero-misa.apk \
            --title "APK actual" \
            --notes "Última versión compilada automáticamente. Descargá cancionero-misa.apk e instalalo."
